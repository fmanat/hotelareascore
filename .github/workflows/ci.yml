# CI — Phase 0 skeleton.
# Gates grow with phases (CLAUDE.md §9): unit → data tests → integration →
# E2E → SEO build-time assertions → golden-set regression.
# Keep every job green; add jobs, don't weaken them.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown sanity (no broken ADR numbering, STATE.md present)
        run: |
          test -f docs/STATE.md
          ls docs/adr/00[1-5]-*.md | wc -l | grep -q '^5$'
          ! grep -rn "TODO-BLOCKING" docs/ || (echo "Blocking TODOs left in docs" && exit 1)

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & typecheck
        run: |
          npm ci
          npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (search -> result -> persona -> compare, mobile, noindex, affiliate rel — CLAUDE.md §9)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  etl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python ETL tests (no-op until Phase 1 pipeline lands)
        run: |
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
            pytest -q
          else
            echo "No pyproject.toml yet — Phase 0: docs-only repo. OK."
          fi
