# Internal taxonomy mapping, keyed on Overture's CURRENT taxonomy fields
# (`taxonomy.primary`, `taxonomy.hierarchy`) — NOT the deprecated `categories`
# field (docs/adr/003 note; data-and-costs.md §1). Verified against a live
# extract of the London bbox on release 2026-08-19.0 (docs/scoring.md v1 =
# "educated prior, not validated" applies to every list below).
#
# Any change to this file changes what counts as a hotel or a nearby fact —
# treat it like a taxonomy-mapping change (CLAUDE.md hard rule 5 / scoring.md
# §6): tests in tests/test_taxonomy.py must cover it.

# ---------------------------------------------------------------------------
# What counts as a "hotel" entity for HotelAreaScore v1 (product-scope
# decision, not a data artifact — see docs/reports/data-proof-report-*.md).
# `taxonomy.hierarchy` contains "lodging" for all of these; we then narrow to
# types that match the product thesis (a bookable hotel-like stay), excluding
# vacation-rental / campground / generic-unclassified lodging.
# ---------------------------------------------------------------------------
hotel_types:
  included:
    - hotel
    - resort
    - inn
    - lodge
    - guest_house
    - bed_and_breakfast
    - hostel
    - service_apartment
  excluded:
    # present under hierarchy=lodging in Overture but out of MVP scope:
    - lodging               # generic/unclassified leaf, too ambiguous to score
    - holiday_rental_home
    - campground
    - cabin
    - cottage
    - rv_park
    - ski_resort
    - beach_resort
    - self_catering_accommodation

# ---------------------------------------------------------------------------
# Scoring dimensions (docs/scoring.md §2). Each entry lists the Overture
# `taxonomy.primary` leaves (exact, verified present) and/or top-level
# `taxonomy.hierarchy[1]` families to match, plus the search radius in
# meters used for that dimension's distance decay.
# ---------------------------------------------------------------------------
dimensions:
  food_essentials:
    radius_m: 400
    categories:
      - restaurant
      - cafe
      - bakery
      - coffee_shop
      - grocery_store
      - convenience_store
      - pharmacy

  walkability_density:
    radius_m: 400
    # broad "useful density" mix, excluding lodging itself and transport
    # infrastructure (transit access is scored separately).
    hierarchies:
      - shopping
      - food_and_drink
      - health_care
      - lifestyle_services
      - arts_and_entertainment

  transit_access:
    radius_m: 800
    categories:
      - train_station
      - metro_station
      - light_rail_and_subway_station
      - bus_station
      - public_transit_facility_or_service

  nightlife_access:
    radius_m: 400
    categories:
      - bar
      - pub
      - dance_club
      - cocktail_bar
      - wine_bar
      - brewery
      - lounge

  # v2 (score_version 1.1.0, docs/adr/006): park/playground access is scored
  # from Overture's base/land_use polygon footprints, distance measured to
  # the polygon's own boundary (not its centroid) -- see land_use below.
  # `display_only_categories` keeps places-theme points showing up in the
  # "Why?" nearby-facts section (a point named e.g. "Hyde Park" or "London
  # Zoo" is still a useful landmark to display) even though those points no
  # longer feed the SCORE.
  #
  # v1.2.0 (docs/adr/007): expanded the polygon filter after diagnostics
  # (docs/reports/family-v1.2.0-diagnostic.md) found real, close green space
  # the v1.1.0 park/playground-only filter missed for several golden-set
  # hotels (managed lawns, sports pitches/tracks, forest, beaches) --
  # verified against a live extract of both base/land_use and base/land
  # (not guessed). Also moved `zoo` from a places-theme point to its
  # base/land_use polygon (`entertainment`/`zoo`, confirmed present --
  # v1.1.0/ADR-006 wrongly assumed zoo had no polygon footprint).
  # `aquarium` stays a point: no land_use/land polygon exists for it.
  #
  # Deliberately EXCLUDED, checked and rejected rather than overlooked:
  # `horticulture` (private gardens/allotments/orchards -- London alone has
  # 28,030 `horticulture/garden` polygons, almost all private back gardens,
  # would swamp the signal), `golf` (private/members courses -- green but
  # not a walkable public family amenity), `agriculture` (private farmland
  # -- meadow/farmland near a hotel is not a family amenity), `campground`
  # (ambiguous, often the lodging property itself), `recreation/stadium`
  # and `recreation/marina` (ticketed venue / boat marina), `tree`/
  # `tree_row` (base/land -- 242,527 individual street trees in London
  # alone; a tree-lined street is not a park), `shrub`/`wetland`/`rock`/
  # `physical` (base/land -- not usable leisure space).
  family_convenience:
    radius_m: 600
    categories:
      - aquarium
    display_only_categories:
      - park
      - playground
      - zoo
    land_use:
      subtypes: [park, protected]  # any class: park/park, park/village_green, park/dog_park, protected/nature_reserve, ...
      recreation_classes: [playground, pitch, recreation_ground, track]
      managed_classes: [grass]
      entertainment_classes: [zoo]
    land:
      subtypes: [forest, grass]  # any class: forest/wood, forest/forest, grass/grass, grass/grassland, grass/meadow
      sand_classes: [beach]      # sand/beach only -- NOT sand/sand (desert/generic sand, not a recreational beach)
    # v1.2.1 (docs/adr/009): the v1.2.0 class expansion above is real,
    # verified green space, but not all of it is a "park to walk to" --
    # median polygon area (all 12 cities, docs/reports/family-v1.2.1-*)
    # shows most `managed/grass` hits are 100-700m2 street verges/traffic
    # islands/lawn slivers, not a place a family visits, while `recreation/
    # pitch`+`track`+`recreation_ground` are real infrastructure but often
    # private/school/club access, not general public family space. Every
    # class below is still counted (nothing removed from v1.2.0's filter)
    # but weighted by how directly it matches "a park a family would visit":
    land_weights:
      full_weight:  # designed public leisure space -- weight 1.0, no area floor
        - {subtype: park}                             # any class
        - {subtype: protected}                         # any class
        - {subtype: entertainment, class: zoo}
        - {subtype: recreation, class: playground}
      reduced_weight:  # built recreation infrastructure, real but often
                       # restricted-access -- weight 0.4, no area floor (a
                       # single pitch/track is already a real, self-limiting
                       # feature; filtering by area would just re-exclude
                       # legitimate small facilities)
        - {subtype: recreation, class: pitch}
        - {subtype: recreation, class: track}
        - {subtype: recreation, class: recreation_ground}
        - {subtype: sand, class: beach}
      reduced_weight_min_area:  # raw land cover, no designed leisure purpose
                                # -- weight 0.4, but only above min_area_m2;
                                # below it, doesn't count at all (excludes
                                # slivers, see medians above)
        - {subtype: managed, class: grass}
        - {subtype: grass}                             # any class
        - {subtype: forest}                             # any class
      reduced_weight_value: 0.4
      min_area_m2: 2000

  quietness_proxy:
    major_road_radius_m: 150
    rail_radius_m: 150
    nightlife_radius_m: 200
    airport_radius_m: 5000
    road_classes: [motorway, trunk, primary]
    nightlife_categories: [bar, pub, dance_club, cocktail_bar, brewery]
    airport_categories: [airport]

# ---------------------------------------------------------------------------
# Entity QA item (d), docs/STATE.md: categories excluded from the "Why?"
# section's displayed nearby_facts ONLY -- they still count toward the
# walkability_density SCORE via the broad hierarchy match (changing that is
# a scoring-formula change, docs/scoring.md §5, out of scope for a display
# fix). These leaves are real businesses but not what a traveler means by
# "what's nearby": personal coaching/consulting, pet services, and delivery
# services aren't places to notice on a walk. Not exhaustive -- extend as
# more display-noise leaves are found (same spirit as entity_qa.py).
# ---------------------------------------------------------------------------
nearby_facts_display_exclude:
  - life_coach
  - health_coaching
  - nutrition_service
  - weight_loss_center
  - image_consultant
  - food_consultant
  - veterinarian
  - pet_groomer
  - pet_boarding
  - pet_sitting
  - dog_walker
  - dog_trainer
  - animal_shelter
  - animal_or_pet_service
  - horse_boarding
  - pet_breeder
  - pet_adoption
  - animal_rescue_service
  - food_delivery_service
  - pizza_delivery_service
