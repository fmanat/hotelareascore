[project]
name = "hotelareascore"
version = "0.1.0"
description = "HotelAreaScore ETL: Overture Maps -> hotel surroundings scores"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "anyascii==0.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hotelareascore = "hotelareascore.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hotelareascore = ["institution_rules.json", "brand_rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
